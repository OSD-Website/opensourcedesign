<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>
        {{ page.title | default: site.title | default: "Open Source Design" }}
    </title>
    <meta name="title" content="{{ page.title | default: site.title }}" />
    <meta
        name="description"
        content="{{ page.description | default: site.description }}"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta
        property="og:title"
        content="{{ page.title | default: site.title }}"
    />
    <meta
        property="og:description"
        content="{{ page.description | default: site.description }}"
    />
    <meta property="og:site_name" content="{{ site.title }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{{ page.url | absolute_url }}" />
    <meta
        name="twitter:title"
        content="{{ page.title | default: site.title }}"
    />
    <meta
        name="twitter:description"
        content="{{ page.description | default: site.description }}"
    />

    <!-- Google Fonts: Work Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
