<footer>
  <div style="max-width: 72rem; margin: 0 auto; display:grid; gap:24px">
    <div style="display:flex; gap:32px; flex-wrap:wrap">
      <div>
        <a href="#" style="font-weight:700; color:var(--text)">Archive</a>
        <p style="margin:4px 0 0; font-size:13px; color:var(--text-muted)">Historical resources & past projects</p>
      </div>
      <div>
        <a href="#" style="font-weight:700; color:var(--text)">Governance</a>
        <p style="margin:4px 0 0; font-size:13px; color:var(--text-muted)">How we're organized</p>
      </div>
      <div>
        <a href="#" style="font-weight:700; color:var(--text)">Contact</a>
        <p style="margin:4px 0 0; font-size:13px; color:var(--text-muted)">Get in touch</p>
      </div>
    </div>
    <p style="margin:0; font-size:13px; color:var(--text-muted)">
      {{ site.title | default: "Open Source Design" }} © {{ 'now' | date: "%Y" }}
    </p>
  </div>
</footer>
