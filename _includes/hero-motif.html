<div class="motif-inline">
    <!-- Circular mosaic pattern -->
    <svg
        viewBox="0 0 400 400"
        preserveAspectRatio="xMidYMid meet"
        aria-hidden="true"
    >
        <defs>
            <!-- Quarter circle tile with concentric rings -->
            <g id="tile">
                <!-- Outermost arc - navy -->
                <path
                    d="M 0,0 A 100,100 0 0,1 100,100 L 80,80 A 80,80 0 0,0 20,20 Z"
                    fill="#1e2a47"
                />
                <!-- Second arc - mint -->
                <path
                    d="M 20,20 A 80,80 0 0,1 80,80 L 65,65 A 65,65 0 0,0 35,35 Z"
                    fill="#5ab5a6"
                />
                <!-- Third arc - light mint -->
                <path
                    d="M 35,35 A 65,65 0 0,1 65,65 L 52,52 A 52,52 0 0,0 48,48 Z"
                    fill="#a8e0d7"
                />
                <!-- Inner arc - white/cream -->
                <path
                    d="M 48,48 A 52,52 0 0,1 52,52 L 40,40 A 40,40 0 0,0 60,60 Z"
                    fill="#ffffff"
                />
                <!-- Center circle - navy -->
                <circle cx="50" cy="50" r="15" fill="#1e2a47" />
            </g>
        </defs>

        <!-- 4x4 Grid with rotations for variety -->
        <!-- Row 1 -->
        <use href="#tile" x="0" y="0" />
        <use href="#tile" x="100" y="0" transform="rotate(90 150 50)" />
        <use href="#tile" x="200" y="0" transform="rotate(180 250 50)" />
        <use href="#tile" x="300" y="0" transform="rotate(270 350 50)" />

        <!-- Row 2 -->
        <use href="#tile" x="0" y="100" transform="rotate(270 50 150)" />
        <use href="#tile" x="100" y="100" transform="rotate(180 150 150)" />
        <use href="#tile" x="200" y="100" transform="rotate(90 250 150)" />
        <use href="#tile" x="300" y="100" />

        <!-- Row 3 -->
        <use href="#tile" x="0" y="200" transform="rotate(180 50 250)" />
        <use href="#tile" x="100" y="200" />
        <use href="#tile" x="200" y="200" transform="rotate(270 250 250)" />
        <use href="#tile" x="300" y="200" transform="rotate(90 350 250)" />

        <!-- Row 4 -->
        <use href="#tile" x="0" y="300" transform="rotate(90 50 350)" />
        <use href="#tile" x="100" y="300" transform="rotate(270 150 350)" />
        <use href="#tile" x="200" y="300" />
        <use href="#tile" x="300" y="300" transform="rotate(180 350 350)" />
    </svg>
</div>
