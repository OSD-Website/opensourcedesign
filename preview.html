<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Preview - Open Source Design Sound Wave</title>
        <style>
            :root {
                --brand-700: #1e2a47;
                --brand-800: #111827;
                --mint-500: #5ab5a6;
                --mint-300: #a8e0d7;
                --neutral-50: #fdfaf7;
                --bg-alt: var(--neutral-50);
                --radius: 16px;
            }
            body {
                font-family: Inter, system-ui, sans-serif;
                margin: 40px;
                background: #fff;
            }
            h1 {
                color: #1e2a47;
            }
            .motif-inline {
                position: relative;
                width: 100%;
                max-width: 65ch;
                height: 288px;
                margin: 32px 0;
                overflow: hidden;
                border-radius: var(--radius);
                background: var(--bg-alt);
            }
            .motif-inline svg {
                position: absolute;
                width: 100%;
                height: 100%;
            }
            .soundwave {
                animation: soundwave 4s ease-in-out infinite;
                transform-origin: center;
            }
            .soundwave-1 {
                animation-delay: 0s;
            }
            .soundwave-2 {
                animation-delay: -1.3s;
            }
            .soundwave-3 {
                animation-delay: -2.6s;
            }
            @keyframes soundwave {
                0%,
                100% {
                    transform: scaleY(1) translateX(0);
                }
                25% {
                    transform: scaleY(1.3) translateX(5px);
                }
                50% {
                    transform: scaleY(0.8) translateX(-5px);
                }
                75% {
                    transform: scaleY(1.2) translateX(3px);
                }
            }
        </style>
    </head>
    <body>
        <h1>Sound Wave Frequency Visualization</h1>
        <p style="color: #5a5450; max-width: 65ch">
            Navy and mint sound wave pattern with animated frequencies.
        </p>

        <div class="motif-inline">
            <svg viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid meet">
                <line
                    x1="0"
                    y1="120"
                    x2="1200"
                    y2="120"
                    stroke="#5ab5a6"
                    stroke-width="2"
                    opacity="0.3"
                />
                <path
                    class="soundwave soundwave-1"
                    d="M0,120 Q50,80 100,120 T200,120 Q250,160 300,120 T400,120 Q450,60 500,120 T600,120 Q650,180 700,120 T800,120 Q850,80 900,120 T1000,120 Q1050,160 1100,120 T1200,120"
                    fill="none"
                    stroke="#1e2a47"
                    stroke-width="3"
                    opacity="0.8"
                />
                <path
                    class="soundwave soundwave-2"
                    d="M0,120 Q50,100 100,120 T200,120 Q250,140 300,120 T400,120 Q450,80 500,120 T600,120 Q650,160 700,120 T800,120 Q850,90 900,120 T1000,120 Q1050,150 1100,120 T1200,120"
                    fill="none"
                    stroke="#5ab5a6"
                    stroke-width="2.5"
                    opacity="0.6"
                />
                <path
                    class="soundwave soundwave-3"
                    d="M0,120 Q50,90 100,120 T200,120 Q250,150 300,120 T400,120 Q450,70 500,120 T600,120 Q650,170 700,120 T800,120 Q850,85 900,120 T1000,120 Q1050,155 1100,120 T1200,120"
                    fill="none"
                    stroke="#111827"
                    stroke-width="2"
                    opacity="0.5"
                />
            </svg>
        </div>
    </body>
</html>
