<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Circular Mosaic Motif Preview</title>
        <style>
            :root {
                --brand-700: #1e2a47;
                --mint-500: #5ab5a6;
                --mint-300: #a8e0d7;
                --neutral-50: #fdfaf7;
            }

            body {
                font-family: Inter, system-ui, sans-serif;
                background: #ffffff;
                margin: 0;
                padding: 40px;
            }

            h1 {
                font-size: 2.5rem;
                font-weight: 800;
                color: var(--brand-700);
                margin: 0 0 20px 0;
            }

            .container {
                max-width: 900px;
                margin: 0 auto;
            }

            .motif-inline {
                max-width: 36rem;
                margin: 12px 0 16px 0;
                border: 2px dashed #e0e0e0;
                padding: 20px;
                border-radius: 8px;
                background: var(--neutral-50);
            }

            .motif-inline svg {
                width: 100%;
                height: auto;
                display: block;
            }

            .info {
                margin-top: 30px;
                padding: 20px;
                background: #f5f5f5;
                border-radius: 8px;
            }
        </style>
    </head>
