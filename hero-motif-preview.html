<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hero Motif Preview - Less Busy Version</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                margin: 0;
                padding: 20px;
                background: #f5f5f5;
            }
            h1 {
                color: #1e2a47;
                margin-bottom: 10px;
            }
            h2 {
                color: #5ab5a6;
                margin-top: 40px;
            }
            p {
                color: #666;
                margin-bottom: 20px;
            }
            .preview-container {
                border: 1px solid #ddd;
                border-radius: 8px;
                overflow: hidden;
                margin-bottom: 40px;
                background: white;
            }
            .hero-motif {
                position: relative;
                width: 600px;
                max-width: 100%;
                height: 300px;
                overflow: hidden;
                border-radius: 8px;
                background: #ffffff;
            }
            .hero-motif svg {
                display: block;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <h1>Hero Motif Preview</h1>

        <h2>New Version (Abstract - Off-center Middle Row)</h2>
        <p>Middle row shifted off-grid for more abstract feel</p>
        <div class="preview-container">
            <div class="hero-motif">
                <svg
                    viewBox="0 0 600 300"
                    preserveAspectRatio="xMidYMid slice"
                    aria-hidden="true"
                >
                    <rect width="600" height="300" fill="#1e2a47" />

                    <!-- Row 1 - y=0 (top edge) - Larger rings -->
                    <circle
                        cx="0"
                        cy="0"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <circle
                        cx="200"
                        cy="0"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <circle
                        cx="400"
                        cy="0"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <circle
                        cx="600"
                        cy="0"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <!-- Inner rings offset down-right -->
                    <circle
                        cx="20"
                        cy="20"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="220"
                        cy="20"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="420"
                        cy="20"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="620"
                        cy="20"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />

                    <!-- Middle elements - shifted off-center, varied positions -->
                    <!-- Left cluster - pushed more left and up -->
                    <circle
                        cx="30"
                        cy="180"
                        r="65"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="22"
                    />
                    <circle
                        cx="10"
                        cy="160"
                        r="38"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="14"
                    />

                    <!-- New ring - left of center, offset down-left -->
                    <circle
                        cx="130"
                        cy="115"
                        r="52"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="110"
                        cy="130"
                        r="30"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="12"
                    />

                    <!-- Center-left ring - offset down-right -->
                    <circle
                        cx="230"
                        cy="130"
                        r="58"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="20"
                    />
                    <circle
                        cx="250"
                        cy="150"
                        r="34"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="14"
                    />

                    <!-- Center-right element - pushed right -->
                    <circle
                        cx="420"
                        cy="140"
                        r="75"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="24"
                    />
                    <circle
                        cx="445"
                        cy="120"
                        r="42"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="16"
                    />

                    <!-- Far right element - near edge -->
                    <circle
                        cx="570"
                        cy="200"
                        r="55"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="20"
                    />
                    <circle
                        cx="590"
                        cy="185"
                        r="32"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="14"
                    />

                    <!-- Row 3 - y=300 (bottom edge) - Larger rings -->
                    <circle
                        cx="0"
                        cy="300"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <circle
                        cx="200"
                        cy="300"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <circle
                        cx="400"
                        cy="300"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <circle
                        cx="600"
                        cy="300"
                        r="90"
                        fill="none"
                        stroke="#5ab5a6"
                        stroke-width="26"
                    />
                    <!-- Inner rings offset up-right -->
                    <circle
                        cx="20"
                        cy="280"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="220"
                        cy="280"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="420"
                        cy="280"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                    <circle
                        cx="620"
                        cy="280"
                        r="55"
                        fill="none"
                        stroke="#7ecdc1"
                        stroke-width="18"
                    />
                </svg>
            </div>
        </div>

        <h2>Color Palette</h2>
        <div style="display: flex; gap: 5px">
            <div
                style="
                    width: 60px;
                    height: 60px;
                    background: #1e2a47;
                    border-radius: 4px;
                "
                title="#1e2a47 Navy"
            ></div>
            <div
                style="
                    width: 60px;
                    height: 60px;
                    background: #5ab5a6;
                    border-radius: 4px;
                "
                title="#5ab5a6 Teal"
            ></div>
            <div
                style="
                    width: 60px;
                    height: 60px;
                    background: #7ecdc1;
                    border-radius: 4px;
                "
                title="#7ecdc1 Mid Mint"
            ></div>
        </div>
    </body>
</html>
